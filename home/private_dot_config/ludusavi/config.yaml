---
runtime:
  threads: ~
  networkSecurity: safe
release:
  check: false
manifest:
  enable: true
language: en-US
theme: dark
roots:
  - store: steam
    path: "<home>/.local/share/Steam"
  - store: lutris
    path: "<home>/.local/share/lutris"
    database: ~
  - store: otherWine
    path: "<home>/.var/app/com.usebottles.bottles/data/bottles/bottles/*"
  - store: heroic
    path: "<home>/games/launcher/heroic"
  - store: otherHome
    path: "<home>"
redirects:
  - kind: bidirectional
    source: "<home>"
    target: /home/main
backup:
  path: "<home>/games/saves/ludusavi"
  ignoredGames: []
  filter:
    excludeStoreScreenshots: true
    cloud:
      exclude: false
      epic: false
      gog: false
      origin: false
      steam: false
      uplay: false
    ignoredPaths: []
    ignoredRegistry: []
  toggledPaths: {}
  toggledRegistry: {}
  sort:
    key: status
    reversed: false
  retention:
    full: 1
    differential: 5
  format:
    chosen: zip
    zip:
      compression: deflate
    compression:
      deflate:
        level: 9
      bzip2:
        level: 9
      zstd:
        level: 10
  onlyConstructive: false
restore:
  path: "<home>/games/saves/ludusavi"
  ignoredGames: []
  toggledPaths: {}
  toggledRegistry: {}
  sort:
    key: status
    reversed: false
  reverseRedirects: false
scan:
  showDeselectedGames: true
  showUnchangedGames: true
  showUnscannedGames: true
cloud:
  remote: ~
  path: ludusavi-backup
  synchronize: true
apps:
  rclone:
    path: /usr/bin/rclone
    arguments: "--fast-list --ignore-checksum"
customGames: []
